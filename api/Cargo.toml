[package]
name = "bookmarks-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "derive"] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.7", features = ["cors"] }
