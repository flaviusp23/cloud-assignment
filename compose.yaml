# Local run: docker compose up --build
# The API is on http://localhost:8090. "db" is a hostname inside the compose network.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev_password # local dev only; in the cloud it's a secret
      POSTGRES_DB: bookmarks
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "bookmarks"]
      interval: 2s
      retries: 15

  api:
    build: ./api
    ports:
      - "8090:8080"
    environment:
      DB_URL: postgres://app:dev_password@db:5432/bookmarks
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
