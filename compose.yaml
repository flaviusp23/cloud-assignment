# Local run: docker compose up --build   (API on http://localhost:8090)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev_password # local only
      POSTGRES_DB: bookmarks
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "bookmarks"]
      interval: 2s
      retries: 15

  api:
    build: ./api
    ports: ["8090:8080"]
    environment:
      DB_URL: postgres://app:dev_password@db:5432/bookmarks
    depends_on:
      db:
        condition: service_healthy
