# CI/CD for the API.
#   pull request  -> build the image only (nothing is published)
#   push to main  -> build, push to Docker Hub tagged with the commit SHA, deploy to Azure

name: api

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for a signed token, used to log in to Azure

env:
  IMAGE: flaviusfen/bookmarks-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: flaviusfen
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The runner is linux/amd64, the same as Azure: no emulation, a fast build.
      - uses: docker/build-push-action@v7
        with:
          context: ./api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # No password stored: Azure trusts tokens from this repo's main branch only.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Point the Container App to the new image
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name bookmarks-api \
            --image ${{ env.IMAGE }}:${{ github.sha }}
