# Pull request: build the image. Push to main: build, push it tagged with the commit, deploy it.
name: api

on:
  push:
    branches: [main]
    paths: ["api/**"]
  pull_request:
    paths: ["api/**"]

permissions:
  contents: read
  id-token: write # lets the deploy job log in to Azure with no password (OIDC)

env:
  IMAGE: flaviusfen/bookmarks-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: flaviusfen
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az extension add --name containerapp --yes
          az containerapp update -g ${{ vars.AZURE_RESOURCE_GROUP }} -n bookmarks-api \
            --image ${{ env.IMAGE }}:${{ github.sha }}
